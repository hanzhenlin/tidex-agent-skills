interface:
  display_name: "Code Start Feature"
  short_description: "按工程约定从 0 到 1 规划并实现新功能或独立能力片段"
  default_prompt: "使用 $code-start-feature 帮我从 0 到 1 规划并实现这个新功能，先做 5 点一线雷达扫描与文码核验，确认后再单轨推进代码。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
